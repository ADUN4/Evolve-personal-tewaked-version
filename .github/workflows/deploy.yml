name: Build and deploy to GitHub Pages

# This workflow is intentionally MANUAL-ONLY.
# The site is deployed by Cloudflare Pages, which builds from this same repo
# (see DEPLOY.md section 4). If this ran on every push it would fail with
# "Pages site not found" until Settings -> Pages -> Source = GitHub Actions
# is enabled, turning every push into a red X.
# Use the Actions tab -> "Run workflow" if you ever want a GitHub Pages mirror.
on:
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Requires package-lock.json to be in sync with package.json.
      # If this step fails with "can only install packages when ... in sync",
      # run "npm install" locally and commit the refreshed lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: node deploy/make-dist.mjs

      - name: Smoke test the built site
        run: node deploy/verify-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # verify-site.mjs only uses the Node standard library, so no npm install here.
      - name: Check every deployed asset
        run: node deploy/verify-site.mjs "${{ needs.deploy.outputs.page_url }}" --wait 90
