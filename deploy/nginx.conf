# nginx config for a static Evolve deployment.
# Used inside the Docker image (copied to /etc/nginx/conf.d/default.conf).
# For a host nginx install, drop this in /etc/nginx/conf.d/evolve.conf and set
# "root" to the directory that contains index.html.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    etag on;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # NOTE: add_header is NOT inherited into blocks that define their own
    # add_header, so the locations below deliberately use "expires" only.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Game entry points must never be served stale - they carry the ?r= build tag.
    location = /index.html   { expires -1; }
    location = /wiki.html    { expires -1; }
    location = /save.html    { expires -1; }
    location = /             { expires -1; }

    # Hashed/versioned assets and vendored libraries: long cache.
    location ~* ^/(evolve|wiki|lib|font)/ {
        expires 7d;
        try_files $uri =404;
    }

    # Localization packs change between builds: short cache.
    location ~* ^/strings/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The game only needs GET/HEAD; anything else is a misconfiguration.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
}
